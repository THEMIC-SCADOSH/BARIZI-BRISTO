<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Barizi Bristo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="barizi.css">
</head>
<body>
<header><h1>Barizi Bristo</h1><small>Resort food &amp; drinks delivery system</small></header>
<main id="app"></main>
<div id="toast" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const SESSION="barizi-session",STATE="barizi-system-state";
const PAGES={customer:"customer.html",chef:"chef.html",gate:"gate.html",rider:"rider.html",accountant:"accountant.html",admin:"admin.html"};
const NAMES={customer:"Customer",chef:"Chef / Kitchen",gate:"Gate",rider:"Rider",accountant:"Accountant",admin:"Admin"};
const DEFAULTS=[["Chef Juma","Chef","chef","chef123"],["Mary (Accounts)","Accountant","accounts","accounts123"],["Gate Officer","Gate","gate","gate123"],["Brian Otieno","Rider","rider","rider123"],["Barizi Admin","Admin","admin","admin123"]];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function roleKey(r){return Object.keys(NAMES).find(k=>NAMES[k].toLowerCase()==String(r).toLowerCase()||k==String(r).toLowerCase())||""}
function readState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")||{}}catch(e){console.error("Could not read saved data.",e);return {}}}
function allUsers(){
  const users=(readState().users||[]).map(u=>({...u}));
  DEFAULTS.forEach(([n,role,username,password])=>{
    let u=users.find(x=>x.username==username||x.n==n);
    if(!u){u={n,role};users.push(u)}
    u.username=u.username||username;u.password=u.password||password;
  });
  return users;
}
function current(){try{return JSON.parse(sessionStorage.getItem(SESSION)||"null")}catch(e){return null}}
function go(u){
  const key=roleKey(u.role);
  if(!PAGES[key]){show("This account has no page assigned.");return}
  try{sessionStorage.setItem(SESSION,JSON.stringify({username:u.username,role:key,name:u.n}))}
  catch(e){console.error(e);show("Browser session storage is unavailable; sign-in cannot continue.");return}
  location.href=PAGES[key];
}
function show(msg){
  const cur=current(),k=cur&&PAGES[cur.role]?cur.role:"";
  $("#app").innerHTML=`<div class="card auth-card">
  <h2>Sign in</h2>
  <p class="mut">One sign-in for every Barizi Bristo page. You'll be taken to the page that matches your account. Accounts and data are stored in this browser and are not secure for real customer or payment information.</p>
  ${k?`<div class="card" style="margin-bottom:10px"><div>Already signed in as <b>${esc(cur.name)}</b> (${NAMES[k]}).</div><div class="row" style="margin-top:6px"><a href="${PAGES[k]}"><button class="p" type="button">Continue to ${NAMES[k]} page</button></a><button type="button" id="out">Sign out</button></div></div>`:""}
  ${msg?`<p class="alert" role="alert">${esc(msg)}</p>`:""}
  <form id="f"><label>Username<br><input name="username" autocomplete="username" required autofocus></label>
  <p><label>Password<br><input name="password" type="password" autocomplete="current-password" required></label></p>
  <button class="p" type="submit">Sign in</button></form>
  <div class="row" style="margin-top:10px"><button type="button" id="newCustomer" aria-haspopup="dialog">New</button><span class="mut">Staff accounts are created by the admin. Ask the admin for your sign-in details.</span></div>
  <dialog id="newCustomerDialog" class="auth-card" aria-labelledby="newCustomerTitle">
  <div class="row sp"><h2 id="newCustomerTitle">Create a customer account</h2><button type="button" id="closeNewCustomer">Close</button></div>
  <p class="mut">This form creates customer accounts only. For staff access, ask the admin to create your account.</p>
  <p id="signupError" class="alert" role="alert" hidden></p>
  <form id="r"><label>Your name<br><input name="name" autocomplete="name" required></label>
  <p><label>Choose a username<br><input name="username" autocomplete="username" required></label></p>
  <p><label>Create a password (6+ characters)<br><input name="password" type="password" autocomplete="new-password" minlength="6" required></label></p>
  <button class="p" type="submit">Create customer account</button></form>
  </dialog></div>`;
  $("#f").onsubmit=e=>{
    e.preventDefault();
    const f=e.currentTarget,un=f.elements.username.value.trim().toLowerCase(),pw=f.elements.password.value;
    const u=allUsers().find(x=>String(x.username||"").toLowerCase()==un&&x.password==pw);
    if(!u){show("Username or password is not valid.");return}
    go(u);
  };
  $("#r").onsubmit=e=>{
    e.preventDefault();
    const f=e.currentTarget,name=f.elements.name.value.trim(),un=f.elements.username.value.trim().toLowerCase(),pw=f.elements.password.value;
    if(!name||!un||pw.length<6){$("#signupError").textContent="Enter your name, username, and a password of at least 6 characters.";$("#signupError").hidden=false;return}
    if(allUsers().some(x=>String(x.username||"").toLowerCase()==un)){$("#signupError").textContent="That username is already in use.";$("#signupError").hidden=false;return}
    const st=readState();
    st.users=st.users||allUsers();
    const u={n:name,role:"Customer",username:un,password:pw,perm:{menu:0,orders:0,cancel:0,ledger:0,users:0}};
    st.users.push(u);
    try{localStorage.setItem(STATE,JSON.stringify(st))}
    catch(err){console.error(err);$("#signupError").textContent="Could not save your account; enable browser storage.";$("#signupError").hidden=false;return}
    go(u);
  };
  const dialog=$("#newCustomerDialog");
  $("#newCustomer").onclick=()=>{dialog.showModal();dialog.querySelector('[name="name"]').focus()};
  $("#closeNewCustomer").onclick=()=>dialog.close();
  const out=$("#out");
  if(out)out.onclick=()=>{try{sessionStorage.removeItem(SESSION)}catch(e){}show()};
}
show();
</script>
</body>
</html>
